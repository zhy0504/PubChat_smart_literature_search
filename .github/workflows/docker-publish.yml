name: Build PubChat Docker images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate production Compose
        run: |
          cp deploy/.env.example deploy/.env
          cp db/postgres/init.sql deploy/init.sql
          trap 'rm -f deploy/.env deploy/init.sql' EXIT
          docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml config

      - name: Generate web image metadata
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pubchat-web
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate search-server image metadata
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pubchat-search-server
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push search-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/search_server/Dockerfile
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate celery-worker image metadata
        id: meta_worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pubchat-celery-worker
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push celery-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/celery_worker/Dockerfile
          push: true
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
